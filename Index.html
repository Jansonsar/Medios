<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expediente: El Auditor Multimedia</title>
<style>
  :root{
    --wood-dark:   #241b11;
    --cork-a:      #40301e;
    --cork-b:      #4d3a24;
    --paper:       #e9dcbd;
    --paper-alt:   #ddcda3;
    --paper-shadow:rgba(0,0,0,0.55);
    --ink:         #2a2013;
    --ink-soft:    #5c4a33;
    --stamp-red:   #a3271d;
    --stamp-green: #2f5233;
    --gold:        #a8823c;
    --pin-red:     #8a1f1f;
    --pin-shine:   #e0736a;
    --font-type:   'Courier New', Courier, monospace;
    --font-serif:  Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.28) 78%),
      repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,0.07) 0px, rgba(0,0,0,0.07) 1px, transparent 2px, transparent 5px),
      repeating-radial-gradient(circle at 70% 65%, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 2px, transparent 6px),
      linear-gradient(160deg, var(--cork-b), var(--cork-a) 60%, var(--wood-dark));
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-serif);
  }

  #app { max-width: 860px; margin: 0 auto; padding: 26px 14px 60px; min-height: 100vh; }

  /* ---------- HEADER ---------- */
  .app-header { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .app-header .title-block { display:flex; align-items:center; gap:12px; }
  .app-header .badge-icon { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; background: radial-gradient(circle at 35% 30%, #f2c9c4, var(--pin-shine) 55%, var(--pin-red) 100%); border:3px solid #f1e6c8; box-shadow:0 3px 8px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.3); }
  .app-header .badge-icon img { width:66%; height:66%; object-fit:contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4)); }
  .app-header h1 { font-family: var(--font-type); color:#f1e6c8; font-size:1.15rem; margin:0; letter-spacing:1.5px; text-transform:uppercase; }
  .app-header p { margin:2px 0 0; font-size:0.78rem; color:#b8a888; font-family: var(--font-type); letter-spacing:0.5px; }
  .confidential-stamp { font-family: var(--font-type); font-weight:700; font-size:0.72rem; letter-spacing:2px; color:var(--stamp-red); border:2px solid var(--stamp-red); padding:4px 10px; border-radius:3px; transform:rotate(-6deg); text-transform:uppercase; opacity:0.85; }

  /* ---------- TABS ---------- */
  .tab-rail { display:flex; flex-wrap:wrap; gap:5px 4px; padding:0 4px; margin-bottom:2px; }
  .tab { flex:0 0 auto; font-family: var(--font-type); font-size:0.7rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:8px 14px 9px; background:var(--paper-alt); color:var(--ink-soft); border-radius:6px 6px 0 0; opacity:0.6; transition: all 0.25s ease; white-space:nowrap; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tab:hover { opacity:0.85; }
  .tab.active:hover { opacity:1; }
  .tab.active { background:var(--paper); color:var(--ink); opacity:1; box-shadow:0 -3px 8px rgba(0,0,0,0.3); }
  .tab.done { opacity:0.85; }
  .tab .check { color:var(--stamp-green); margin-left:4px; }
  .tab-intro { background:linear-gradient(160deg, #5a6b73, #3f4d54); color:#eef3f4; opacity:0.85; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding-left:14px; padding-right:14px; }
  .tab-intro:hover { opacity:1; }
  .tab-intro.active { background:var(--paper); color:var(--ink-soft); opacity:1; box-shadow:0 -3px 8px rgba(0,0,0,0.3); }
  .tab-intro svg { width:15px; height:15px; flex:0 0 auto; }

  /* ---------- FOLDER ---------- */
  .folder { position:relative; background:var(--paper); border-radius:2px 8px 8px 8px; padding:24px 22px 22px; box-shadow:0 18px 40px var(--paper-shadow), 6px 8px 0 -2px var(--paper-alt), 6px 8px 0 0 rgba(0,0,0,0.25); animation: dropIn 0.4s ease; }
  @keyframes dropIn { from{opacity:0; transform:translateY(-14px) rotate(-1deg);} to{opacity:1; transform:translateY(0) rotate(0.3deg);} }

  /* ---------- JUEGO 1 · Trampa + Bucle de conexión de recursos ---------- */
  .btn-phase { font-family: var(--font-type); background:var(--ink); color:var(--paper); border:none; padding:11px 18px; border-radius:3px; font-weight:700; font-size:0.78rem; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:filter 0.2s, opacity 0.2s; }
  .btn-phase:hover { filter:brightness(1.3); }
  .btn-phase:active { transform: scale(0.98); }
  .btn-phase.hidden { display:none; }

  .round-counter { font-family: var(--font-type); font-size:0.68rem; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px; }
  .round-scenario { font-family: var(--font-serif); font-style:italic; font-size:0.98rem; line-height:1.55; color:var(--ink); background:#f3ecd8; border-left:4px solid var(--gold); padding:12px 14px; border-radius:0 6px 6px 0; margin-bottom:16px; }

  .connector-grid, .trap-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:10px; margin-bottom:14px; }
  .connector-btn, .trap-card { position:relative; font-family: var(--font-type); background:#fff; border:2px solid var(--gold); border-radius:8px; padding:14px 8px 10px; text-align:center; font-size:0.72rem; font-weight:700; color:var(--ink); cursor:pointer; box-shadow:0 3px 6px rgba(0,0,0,0.2); transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s; }
  .connector-btn .c-icon, .trap-card .c-icon { display:block; font-size:1.5rem; margin-bottom:4px; }
  .connector-btn:hover, .trap-card:hover { transform:translateY(-2px); }
  .connector-btn:disabled { cursor:default; opacity:0.55; }

  .connector-btn.wrong, .trap-card.wrong { border-color:var(--stamp-red); animation: spark 0.4s; }
  .connector-btn.correct { border-color:var(--stamp-green); background:#e9f6e9; box-shadow:0 0 0 3px rgba(47,82,51,0.35), 0 3px 10px rgba(47,82,51,0.4); animation: circuit-glow 0.5s; }
  @keyframes spark { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-5px);} 40%{transform:translateX(5px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
  @keyframes circuit-glow { 0%{box-shadow:0 0 0 0 rgba(47,82,51,0.6);} 100%{box-shadow:0 0 0 6px rgba(47,82,51,0);} }

  .round-feedback { font-family: var(--font-type); font-size:0.8rem; font-weight:700; line-height:1.5; padding:10px 12px; border-radius:4px; margin-top:4px; display:none; }
  .round-feedback.show { display:block; }
  .round-feedback.fail { background:rgba(163,39,29,0.1); color:var(--stamp-red); border:1px dashed var(--stamp-red); }
  .round-feedback.ok { background:rgba(47,82,51,0.1); color:var(--stamp-green); border:1px dashed var(--stamp-green); }

  .trap-msg { font-family: var(--font-type); font-size:0.82rem; font-weight:700; line-height:1.6; color:var(--stamp-red); background:rgba(163,39,29,0.1); border:1px dashed var(--stamp-red); padding:12px 14px; border-radius:4px; margin:6px 0 16px; display:none; }
  .trap-msg.show { display:block; animation: dropIn 0.3s ease; }

  .trophy-box { text-align:center; padding:20px 10px 6px; }
  .trophy-box .t-icon { font-size:2.6rem; margin-bottom:8px; }
  .trophy-box p { font-family: var(--font-serif); font-style:italic; font-size:0.95rem; line-height:1.6; color:var(--ink); max-width:420px; margin:0 auto 18px; }

  .circuit-strip { display:flex; gap:7px; align-items:center; margin-bottom:14px; }
  .circuit-node { width:16px; height:16px; border-radius:50%; background:#d9c89a; border:2px solid var(--gold); flex:0 0 auto; transition: all 0.3s ease; }
  .circuit-node.lit { background:var(--stamp-green); border-color:var(--stamp-green); box-shadow:0 0 6px rgba(47,82,51,0.6); }
  .circuit-node.current { border-color:var(--stamp-red); box-shadow:0 0 0 3px rgba(163,39,29,0.25); animation: node-pulse 1.2s ease-in-out infinite; }
  @keyframes node-pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

  /* ---------- JUEGO 2 · Filtro de formatos (swipe sí/no) ---------- */
  .swipe-stack { position:relative; height:150px; margin-bottom:16px; display:flex; align-items:center; justify-content:center; }
  .swipe-card { width:210px; max-width:80%; background:#fff; border:3px solid var(--gold); border-radius:14px; padding:20px 14px 16px; text-align:center; box-shadow:0 6px 14px rgba(0,0,0,0.25); cursor:grab; touch-action:none; user-select:none; transition: transform 0.25s ease, opacity 0.25s ease, border-color 0.2s; position:relative; }
  .swipe-card:active { cursor:grabbing; }
  .swipe-card .sw-icon { font-size:2.5rem; display:block; margin-bottom:8px; }
  .swipe-card .sw-label { font-family: var(--font-type); font-weight:700; font-size:0.92rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink); }
  .swipe-card.no-drag-transition { transition:none; }
  .swipe-card.fly-right { transform:translateX(280px) rotate(20deg) !important; opacity:0; }
  .swipe-card.fly-left { transform:translateX(-280px) rotate(-20deg) !important; opacity:0; }
  .swipe-card.shake { animation: spark 0.4s; border-color:var(--stamp-red); }
  .swipe-hint { position:absolute; top:8px; font-family: var(--font-type); font-weight:900; font-size:0.72rem; letter-spacing:1.5px; padding:3px 9px; border-radius:4px; border:2px solid; opacity:0; transition:opacity 0.1s; pointer-events:none; }
  .swipe-hint.si { right:8px; color:var(--stamp-green); border-color:var(--stamp-green); transform:rotate(8deg); }
  .swipe-hint.no { left:8px; color:var(--stamp-red); border-color:var(--stamp-red); transform:rotate(-8deg); }

  .swipe-actions { display:flex; gap:14px; justify-content:center; margin-bottom:10px; }
  .swipe-btn { font-family: var(--font-type); font-weight:700; font-size:0.76rem; letter-spacing:0.5px; text-transform:uppercase; padding:11px 18px; border-radius:30px; cursor:pointer; border:2px solid; background:#fff; transition: transform 0.15s, filter 0.15s; }
  .swipe-btn.reject { color:var(--stamp-red); border-color:var(--stamp-red); }
  .swipe-btn.accept { color:var(--stamp-green); border-color:var(--stamp-green); }
  .swipe-btn:hover { transform:translateY(-2px); }
  .swipe-btn:active { transform:scale(0.96); }
  .swipe-btn:disabled { opacity:0.4; cursor:default; transform:none; }

  .swipe-why { font-family: var(--font-serif); font-size:0.85rem; line-height:1.55; padding:10px 12px; border-radius:8px; margin-top:2px; display:none; }
  .swipe-why.show { display:block; animation: dropIn 0.25s ease; }
  .swipe-why.ok { background:rgba(47,82,51,0.1); color:var(--stamp-green); }
  .swipe-why.bad { background:rgba(163,39,29,0.1); color:var(--stamp-red); }

  /* ---------- JUEGO 2 antiguo (sin usar, se deja por compatibilidad de estilos) ---------- */
  .duel-arena { display:flex; align-items:stretch; gap:10px; margin-bottom:6px; }
  .duel-card { flex:1 1 0; background:#fff; border:3px solid var(--gold); border-radius:12px; padding:18px 10px 14px; text-align:center; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.2); transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s; position:relative; }
  .duel-card:hover { transform:translateY(-2px); }
  .duel-card .d-icon { font-size:2.1rem; display:block; margin-bottom:6px; }
  .duel-card .d-label { font-family: var(--font-type); font-weight:700; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink); }
  .duel-card.wrong { border-color:var(--stamp-red); animation: spark 0.4s; }
  .duel-card.correct { border-color:var(--stamp-green); background:#e9f6e9; box-shadow:0 0 0 3px rgba(47,82,51,0.35), 0 3px 10px rgba(47,82,51,0.4); animation: circuit-glow 0.5s; }
  .duel-card.faded { opacity:0.4; cursor:default; }
  .duel-card:disabled, .duel-card.locked { cursor:default; }
  .duel-vs { flex:0 0 auto; align-self:center; font-family: var(--font-type); font-weight:900; font-size:0.85rem; color:var(--stamp-red); background:var(--paper); border:2px solid var(--stamp-red); border-radius:50%; width:38px; height:38px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.3); }
  .duel-why { font-family: var(--font-serif); font-size:0.82rem; line-height:1.5; padding:8px 10px; border-radius:6px; margin-top:8px; text-align:left; display:none; }
  .duel-card.correct .duel-why, .duel-card.wrong .duel-why { display:block; }
  .duel-card.correct .duel-why { background:rgba(47,82,51,0.08); color:var(--stamp-green); }
  .duel-card.wrong .duel-why { background:rgba(163,39,29,0.08); color:var(--stamp-red); }

  /* ---------- JUEGO 3 · Línea de tiempo (arrastrar a la época) ---------- */
  .timeline-scroll { overflow-x:auto; padding-bottom:8px; margin-bottom:6px; -webkit-overflow-scrolling:touch; }
  .timeline-strip { display:flex; gap:8px; min-width:min-content; }
  .era-box { flex:1 1 112px; min-width:104px; background:#f3ecd8; border:3px dashed #5c4a33; border-radius:10px; padding:8px 6px 10px; text-align:center; transition: border-color 0.2s, background 0.2s; }
  .era-box.era-full { border-style:solid; border-color:var(--stamp-green); background: rgba(230,255,230,0.85); }
  .era-box-icon { font-size:1.25rem; margin-bottom:2px; }
  .era-box-label { font-family: var(--font-type); font-size:0.6rem; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; color:var(--ink-soft); line-height:1.25; margin-bottom:8px; min-height:2.3em; }
  .era-slots { display:flex; gap:4px; justify-content:center; }
  .era-slot { width:34px; height:34px; border-radius:6px; border:2px dashed #c9b98d; display:flex; align-items:center; justify-content:center; font-size:1.05rem; background:rgba(255,255,255,0.5); }
  .era-slot.filled { border-style:solid; border-color:var(--stamp-green); background:#fff; }
  .timeline-tray-label { font-family: var(--font-type); font-size:0.68rem; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin:12px 0 8px; text-align:center; }
  .obj-chip { display:flex; align-items:center; gap:6px; }
  .obj-chip .chip-ico { font-size:1.15rem; }
  .obj-chip .chip-txt { font-size:0.78rem; }
  .folder-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .case-number { font-family: var(--font-type); font-size:0.72rem; letter-spacing:1.5px; color:var(--ink-soft); text-transform:uppercase; border:1px solid var(--ink-soft); padding:3px 8px; border-radius:2px; }
  .principle-tag { font-family: var(--font-type); font-size:0.72rem; letter-spacing:1px; color:#fff; background:var(--stamp-green); padding:3px 9px; border-radius:2px; text-transform:uppercase; }
  .folder h2 { font-family: var(--font-serif); font-size:1.28rem; margin:6px 0 12px; color:var(--ink); border-bottom:2px dashed var(--ink-soft); padding-bottom:10px; }
  .section-label { font-family: var(--font-type); font-size:0.7rem; letter-spacing:1.2px; text-transform:uppercase; color:var(--stamp-red); margin-bottom:6px; font-weight:700; }
  .declaration { font-size:0.95rem; line-height:1.6; color:var(--ink); margin-bottom:18px; font-style:italic; }

  /* ---------- EVIDENCE ---------- */
  .evidence-wrap { position:relative; margin-bottom:20px; }
  .paperclip { position:absolute; top:-14px; left:24px; width:26px; height:46px; border:4px solid #9aa3ab; border-radius:40% 40% 50% 50%; box-shadow:2px 2px 4px rgba(0,0,0,0.4); z-index:2; transform:rotate(-8deg); }
  .paperclip::after { content:""; position:absolute; top:6px; left:6px; width:10px; height:26px; border:4px solid #9aa3ab; border-radius:40% 40% 50% 50%; }
  .evidence { background:#f3ecd8; border:1px solid #c9b98d; padding:16px 14px 14px; box-shadow:0 6px 14px rgba(0,0,0,0.35); transform:rotate(-0.4deg); }
  .evidence-label { font-family: var(--font-type); font-size:0.68rem; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:12px; border-bottom:1px solid #c9b98d; padding-bottom:6px; }
  .evidence-inner { font-size:0.86rem; line-height:1.5; color:#3a2f20; }

  .interrogation-label { font-family: var(--font-type); font-size:0.78rem; letter-spacing:1px; text-transform:uppercase; color:var(--ink); background:var(--gold); display:inline-block; padding:4px 10px; margin-bottom:12px; border-radius:2px; }
  .question-text { font-weight:700; font-size:0.96rem; margin-bottom:16px; color:var(--ink); line-height:1.5; }

  /* ---------- VERIFY ROW ---------- */
  .verify-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .btn-verify { font-family: var(--font-type); background:var(--ink); color:var(--paper); border:none; padding:12px 20px; border-radius:3px; font-weight:700; font-size:0.82rem; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:filter 0.2s; }
  .btn-verify:hover { filter:brightness(1.3); }
  .btn-verify:active { transform: scale(0.98); }

  .verdict-stamp { font-family: var(--font-type); font-weight:900; font-size:1rem; letter-spacing:2px; padding:6px 14px; border:3px solid currentColor; border-radius:4px; text-transform:uppercase; opacity:0; transform: rotate(-10deg) scale(2); pointer-events:none; }
  .verdict-stamp.approved { color:var(--stamp-green); }
  .verdict-stamp.rejected { color:var(--stamp-red); }
  .verdict-stamp.show { animation: stampDown 0.4s cubic-bezier(.35,1.6,.6,1) forwards; }
  @keyframes stampDown { 0%{transform:rotate(-10deg) scale(2.2); opacity:0;} 60%{opacity:0.95;} 100%{transform:rotate(-10deg) scale(1); opacity:0.92;} }

  /* ---------- NOTES ---------- */
  .notes { margin-top:16px; padding:14px 16px; border-left:4px solid var(--ink-soft); background:rgba(0,0,0,0.04); font-family: var(--font-serif); font-style:italic; font-size:0.9rem; line-height:1.55; color:var(--ink); display:none; }
  .notes.show { display:block; animation: dropIn 0.3s ease; }
  .notes strong { display:block; font-style:normal; font-family: var(--font-type); font-size:0.72rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; color:var(--stamp-red); }
  .notes.success strong { color: var(--stamp-green); }

  .actions { display:flex; justify-content:flex-end; margin-top:18px; }
  .btn-next { font-family: var(--font-type); background:transparent; color:var(--stamp-red); border:2px solid var(--stamp-red); padding:10px 18px; border-radius:3px; font-weight:700; font-size:0.82rem; letter-spacing:1px; text-transform:uppercase; cursor:pointer; display:none; transition: background 0.2s, color 0.2s; }
  .btn-next.show { display:inline-block; }
  .btn-next:hover { background:var(--stamp-red); color:#fff2e6; }

  /* ================= LEVEL 1: COHERENCIA (mezcladora) ================= */
  .console-box { }
  .meter-wrap { margin-bottom: 16px; }
  .meter-label { font-family: var(--font-type); font-size:0.68rem; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .meter-bar-bg { width:100%; height:14px; background:#c9b98d; border-radius:999px; overflow:hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
  .meter-bar-fill { height:100%; background: linear-gradient(90deg, var(--stamp-green), #6fae2f); border-radius:999px; transition: width 0.3s ease, background 0.3s ease; width:100%; }
  .meter-value { font-family: var(--font-type); font-size:0.72rem; color:var(--ink-soft); margin-top:4px; text-align:right; }

  .volume-control { margin-bottom:16px; }
  .volume-control label { display:block; font-size:0.82rem; margin-bottom:6px; font-weight:700; }
  .volume-control input[type=range] { width:100%; accent-color: var(--stamp-red); touch-action: none; }

  .gif-row { display:flex; gap:10px; flex-wrap:wrap; }
  .gif-chip { font-family: var(--font-serif); background:#fff; border:2px solid #c9b98d; border-radius:8px; padding:10px 14px; font-size:1.3rem; cursor:pointer; position:relative; transition: opacity 0.25s, transform 0.2s; }
  .gif-chip .chip-x { display:block; font-family: var(--font-type); font-size:0.6rem; color:var(--stamp-red); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
  .gif-chip.removed { opacity:0.25; text-decoration: line-through; transform: scale(0.9); cursor:default; }

  /* ================= LEVEL 2: CONTIGÜIDAD (drag labels) ================= */
  .dnd-zone { position:relative; }
  .diagram-wrap {
    position:relative;
    width:100%;
    aspect-ratio: 1408 / 768;
    margin-bottom:16px;
    border-radius:10px;
    overflow:hidden;
    background-size: cover;
    background-position: center;
    background-color:#bcd4e6;
    border: 1px solid #c9b98d;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
  }
  .dropzone { position:absolute; width:82px; height:82px; margin-left:-41px; margin-top:-41px; border-radius:50%; border:3px dashed #5c4a33; background: rgba(255,255,255,0.35); display:flex; align-items:center; justify-content:center; text-align:center; font-family: var(--font-type); font-size:0.6rem; padding:4px; color:var(--ink-soft); }
  .dropzone.filled { border-style:solid; border-color:var(--stamp-green); background: rgba(230,255,230,0.85); color:var(--ink); font-weight:700; }
  .dz-hint { font-size:1.4rem; }

  .chip-tray { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding-top:6px; border-top:1px dashed #c9b98d; }
  .chip { font-family: var(--font-serif); background:#fff; border:2px solid var(--gold); border-radius:8px; padding:10px 14px; font-size:0.85rem; font-weight:700; cursor:grab; touch-action:none; user-select:none; box-shadow:0 3px 6px rgba(0,0,0,0.25); }
  .chip.placed { visibility:hidden; }
  .chip.shake { animation: shake 0.35s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* ================= LEVEL 3: SEÑALIZACIÓN (resaltar texto) ================= */
  .highlight-para { font-size:0.9rem; line-height:1.9; }
  .word-chunk { cursor:pointer; padding:1px 2px; border-radius:3px; transition: background 0.15s; }
  .word-chunk:hover { background: rgba(168,130,60,0.25); }
  .word-chunk.highlighted { background: #ffe38a; box-shadow: 0 2px 0 #d9a441; font-weight:700; }

  /* ================= LEVEL 4: SEGMENTACIÓN (línea de tiempo) ================= */
  .timeline-wrap { position:relative; height:56px; margin: 30px 4px 16px; }
  .timeline-track { position:absolute; top:24px; left:0; right:0; height:8px; background:#c9b98d; border-radius:999px; }
  .tl-zone { position:absolute; top:20px; height:16px; background: rgba(47,82,51,0.25); border: 1px dashed var(--stamp-green); border-radius:6px; }
  .marker { position:absolute; top:-4px; width:30px; height:30px; margin-left:-15px; background:#fff; border:2px solid var(--stamp-red); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.9rem; cursor:grab; touch-action:none; box-shadow:0 3px 6px rgba(0,0,0,0.3); }
  .timeline-caption { display:flex; justify-content:space-between; font-family: var(--font-type); font-size:0.68rem; color:var(--ink-soft); margin-top:2px; }

  /* --- corte por clic + módulos resultantes --- */
  .cut-track { position:relative; height:64px; margin: 10px 2px 4px; background:#c9b98d; border-radius:10px; cursor: crosshair; overflow:hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); border: 1px solid #a8823c; }
  .cut-track::before { content: "✂️ haz clic dos veces para cortar la cinta"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family: var(--font-type); font-size:0.68rem; color: var(--ink-soft); text-align:center; padding: 0 10px; pointer-events:none; }
  .cut-track.has-cuts::before { content:""; }
  .cut-mark { position:absolute; top:0; bottom:0; width:3px; background: var(--stamp-red); box-shadow: 0 0 0 3px rgba(163,39,29,0.15); z-index:2; }
  .cut-mark::before { content:"✂️"; position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:0.85rem; }
  .cut-segment { position:absolute; top:6px; bottom:6px; border-radius:6px; background:#f3ecd8; border:2px dashed var(--stamp-green); display:flex; align-items:center; justify-content:center; text-align:center; font-family: var(--font-type); font-size:0.66rem; font-weight:700; letter-spacing:0.5px; color:var(--stamp-green); text-transform:uppercase; padding:2px; animation: dropIn 0.3s ease both; }
  .cut-hint-text { margin-top:8px; font-family: var(--font-type); font-size:0.7rem; color: var(--ink-soft); }

  /* ================= LEVEL 5: MODALIDAD (grabadora de testimonio) ================= */
  .modality-demo { text-align:center; }

  .channel-status { font-size:0.85rem; font-weight:700; padding:10px 12px; border-radius:6px; margin-bottom:14px; background:#f6efd9; border:1px dashed var(--ink-soft); transition: background 0.2s, border-color 0.2s; }
  .channel-status.ok { background:#e4ecdd; border-color:var(--stamp-green); }

  .modal-meter-wrap { margin-bottom:16px; text-align:left; }
  .modal-meter-label { font-family: var(--font-type); font-size:0.68rem; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }

  .mock-screen { background:#12181f; color:#dfe7ee; border-radius:8px; padding:16px; min-height:100px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; margin-bottom:18px; }
  .mock-screen .engine-icon { font-size:1.8rem; }
  .mock-screen p { font-size:0.78rem; line-height:1.5; margin:0; color:#b9c6d1; transition: opacity 0.1s linear; }
  .audio-indicator { font-size:0.85rem; color:#8be29a; font-family: var(--font-type); opacity:0; transition: opacity 0.1s linear; }
  .wave { letter-spacing:1px; display:inline-block; animation: wavepulse 1.2s infinite ease-in-out; }
  @keyframes wavepulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

  .record-control { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .record-btn { position:relative; width:96px; height:96px; border-radius:50%; border:none; background:var(--paper-alt); cursor:pointer; display:flex; align-items:center; justify-content:center; touch-action:none; -webkit-user-select:none; user-select:none; box-shadow:0 4px 10px rgba(0,0,0,0.3); transition: transform 0.15s ease; }
  .record-btn:active { transform: scale(0.96); }
  .record-btn.completed { background:#dcefdc; }
  .record-ring { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .record-ring .ring-bg { fill:none; stroke:#c9b98d; stroke-width:6; }
  .record-ring .ring-fill { fill:none; stroke:var(--stamp-red); stroke-width:6; stroke-linecap:round; stroke-dasharray:276.5; stroke-dashoffset:276.5; }
  .record-btn.completed .ring-fill { stroke: var(--stamp-green); }
  .record-icon { font-size:2.1rem; position:relative; z-index:1; pointer-events:none; }
  .record-label { font-family: var(--font-type); font-size:0.72rem; letter-spacing:0.5px; color:var(--ink-soft); text-transform:uppercase; min-height:1.4em; }

  /* ---------- BOARD (victory) ---------- */
  .board { position:relative; background: repeating-radial-gradient(circle at 25% 35%, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 2px, transparent 5px), repeating-radial-gradient(circle at 75% 70%, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 1px, transparent 2px, transparent 6px), linear-gradient(150deg, #4a341d, #3a2917 70%); border:10px solid #2a1d10; border-radius:6px; padding:34px 20px 26px; box-shadow:0 20px 50px rgba(0,0,0,0.6); overflow:hidden; text-align:center; }
  .board-title { font-family: var(--font-type); color:#f1e6c8; font-size:1.05rem; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:4px; }
  .board-sub { font-family: var(--font-serif); font-style:italic; color:#d8c7a3; font-size:0.85rem; margin-bottom:28px; }
  .closed-stamp { position:absolute; top:30px; right:-10px; font-family: var(--font-type); font-weight:900; font-size:1.6rem; letter-spacing:3px; color:var(--stamp-red); border:5px solid var(--stamp-red); padding:8px 18px; border-radius:6px; transform:rotate(-14deg); opacity:0.88; mix-blend-mode:multiply; animation: stampDown 0.6s cubic-bezier(.35,1.6,.6,1) 0.15s both; white-space:nowrap; }
  @media (max-width:560px){ .closed-stamp{ position:static; display:inline-block; margin-bottom:20px; transform:rotate(-6deg); font-size:1.15rem; } }
  .pin-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:22px 18px; margin-bottom:28px; }
  .pin-card { position:relative; width:150px; background:var(--paper); padding:14px 10px 12px; box-shadow:0 8px 16px rgba(0,0,0,0.45); font-family: var(--font-type); }
  .pin-card:nth-child(odd){ transform:rotate(-3deg); }
  .pin-card:nth-child(even){ transform:rotate(2.5deg); }
  .pin-dot { position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:16px; height:16px; border-radius:50%; background: radial-gradient(circle at 30% 30%, var(--pin-shine), var(--pin-red) 70%); box-shadow:0 3px 4px rgba(0,0,0,0.5); }
  .pin-card .p-name { font-size:0.66rem; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink); font-weight:700; margin-bottom:8px; line-height:1.3; }
  .pin-card .p-status { font-size:0.62rem; color:var(--stamp-green); font-weight:700; }
  .pin-card .p-status.retry { color:var(--stamp-red); }
  .report-line { font-family: var(--font-type); color:#f1e6c8; font-size:0.95rem; margin-bottom:26px; }
  .report-line span { color:var(--gold); font-weight:700; }
  .btn-restart { font-family: var(--font-type); background:var(--gold); color:#2a1d10; border:none; padding:12px 24px; border-radius:3px; font-weight:700; font-size:0.82rem; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:filter 0.2s; }
  .btn-restart:hover { filter:brightness(1.12); }

  footer.note { text-align:center; color:#8a7a5f; font-family: var(--font-type); font-size:0.68rem; letter-spacing:0.5px; margin-top:30px; }

  /* ---------- INTRO / BRIEFING ---------- */
  .briefing-icon-wrap { position:relative; width:70px; height:70px; margin:0 auto 10px; }
  .briefing-icon { font-size:2.4rem; text-align:center; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5)); }
  .briefing-icon-wrap .spark { position:absolute; width:16px; height:3px; background:var(--gold); border-radius:2px; opacity:0.8; }
  .briefing-icon-wrap .spark.s1 { top:6px; left:-22px; transform:rotate(-35deg); }
  .briefing-icon-wrap .spark.s2 { top:22px; left:-30px; transform:rotate(15deg); width:11px; }
  .briefing-icon-wrap .spark.s3 { top:6px; right:-22px; transform:rotate(35deg); }
  .briefing-icon-wrap .spark.s4 { top:22px; right:-30px; transform:rotate(-15deg); width:11px; }
  .briefing-title { font-family: var(--font-serif); font-size:1.35rem; text-align:center; margin:0 0 4px; color:var(--ink); }
  .briefing-sub { font-family: var(--font-type); font-size:0.7rem; letter-spacing:1.5px; text-transform:uppercase; text-align:center; color:var(--stamp-red); margin-bottom:18px; }
  .briefing-text { font-size:0.95rem; line-height:1.7; color:var(--ink); margin-bottom:14px; }
  .briefing-text strong { color:var(--stamp-green); }
  .briefing-examples { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0 20px; }
  .briefing-chip { font-family: var(--font-type); font-size:0.72rem; background:#f3ecd8; border:1px solid #c9b98d; padding:6px 12px; border-radius:20px; color:var(--ink-soft); }

  .briefing-channels { display:flex; flex-wrap:wrap; justify-content:center; gap:18px 22px; margin:8px 0 20px; }
  .briefing-channel { display:flex; flex-direction:column; align-items:center; gap:7px; width:76px; }
  .briefing-channel .bc-badge { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.7rem; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.5), 0 3px 8px rgba(0,0,0,0.25); }
  .briefing-channel .bc-label { font-family: var(--font-type); font-size:0.62rem; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; text-align:center; }
  .bc-badge.bc-imagen { background:#cfe0c2; }
  .bc-badge.bc-sonido { background:#dcd2ec; }
  .bc-badge.bc-texto  { background:#ecdfb8; }
  .bc-badge.bc-movimiento { background:#c6d8ea; }
  .bc-label.bc-imagen { color:#3d6b2a; }
  .bc-label.bc-sonido { color:#5b4a8a; }
  .bc-label.bc-texto  { color:#8a6a1e; }
  .bc-label.bc-movimiento { color:#2c5a7d; }

  .briefing-callout { position:relative; display:flex; align-items:center; gap:12px; background:#f0dfae; border:1px solid #d9b979; border-radius:10px; padding:16px 16px 16px 14px; margin:8px 0 22px; transform:rotate(-0.6deg); box-shadow:0 6px 14px rgba(0,0,0,0.2); }
  .briefing-callout .co-icon { font-size:1.5rem; flex:0 0 auto; }
  .briefing-callout p { margin:0; font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; font-size:1.05rem; line-height:1.4; color:#3a2f14; }
  .briefing-callout::after { content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%) rotate(-2deg); width:70px; height:18px; background:rgba(150,160,140,0.55); border:1px solid rgba(120,130,110,0.4); }

  .briefing-actions { display:flex; justify-content:center; margin-top:20px; }
  .btn-start { font-family: var(--font-type); background:var(--stamp-green); color:#f1e6c8; border:none; padding:13px 26px; border-radius:3px; font-weight:700; font-size:0.85rem; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:filter 0.2s; box-shadow:0 6px 14px rgba(0,0,0,0.35); display:inline-flex; align-items:center; gap:9px; }
  .btn-start:hover { filter:brightness(1.15); }
  .btn-start:active { transform: scale(0.98); }

  @media (max-width:480px){
    .folder{ padding:18px 14px 16px; }
    .app-header h1{ font-size:0.95rem; }
    .confidential-stamp{ font-size:0.62rem; }
    .dropzone{ width:66px; height:66px; margin-left:-33px; margin-top:-33px; font-size:0.55rem; }
    .diagram-wrap{ height:200px; }
    .duel-card{ padding:12px 6px 10px; }

    .duel-card .d-label{ font-size:0.68rem; }
    .duel-why{ font-size:0.72rem; padding:6px 8px; }
    .duel-vs{ width:30px; height:30px; font-size:0.68rem; }
  }
</style>

  // ==================================================================
  // NIVEL 1 · COHERENCIA — consola de silenciar ruido
  // ==================================================================
  function buildCoherencia(zone){
    zone.innerHTML = `
      <div class="console-box">
        <div class="meter-wrap">
          <div class="meter-label">Medidor de ruido cognitivo</div>
          <div class="meter-bar-bg"><div class="meter-bar-fill" id="noise-fill"></div></div>
          <div class="meter-value" id="noise-value">100% de ruido</div>
        </div>
        <div class="volume-control">
          <label>🔊 Volumen de la música de fondo</label>
          <input type="range" id="volume-slider" min="0" max="100" value="100">
          <audio id="noise-audio" loop src="${AUDIO_RUIDO}"></audio>
        </div>
        <div class="gif-row" id="gif-row">
          <button type="button" class="gif-chip" data-gif="0"><img src="${GIF_BANANA}" alt="GIF decorativo" style="height:48px; display:block;"><span class="chip-x">✕ quitar</span></button>
          <button type="button" class="gif-chip" data-gif="1"><img src="${GIF_TENOR}" alt="GIF decorativo" style="height:48px; display:block;"><span class="chip-x">✕ quitar</span></button>
        </div>
      </div>
    `;

    const slider = zone.querySelector("#volume-slider");
    const audio = zone.querySelector("#noise-audio");
    const fill = zone.querySelector("#noise-fill");
    const valueLabel = zone.querySelector("#noise-value");
    const gifChips = Array.from(zone.querySelectorAll(".gif-chip"));
    const TOTAL_GIFS = gifChips.length;
    const removed = new Set();

    function update(){
      const volumePart = (parseInt(slider.value, 10) / 100) * 60;
      const gifsRemaining = TOTAL_GIFS - removed.size;
      const gifPart = (gifsRemaining / TOTAL_GIFS) * 40;
      const noise = Math.round(volumePart + gifPart);
      fill.style.width = noise + "%";
      fill.style.background = noise > 55
        ? "linear-gradient(90deg, var(--stamp-red), #d97757)"
        : (noise > 20 ? "linear-gradient(90deg, var(--gold), #d9b25c)" : "linear-gradient(90deg, var(--stamp-green), #6fae2f)");
      valueLabel.textContent = noise + "% de ruido";

      audio.volume = parseInt(slider.value, 10) / 100;
      if (parseInt(slider.value, 10) > 0) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    slider.addEventListener("input", update);
    gifChips.forEach(chip => {
      chip.addEventListener("click", () => {
        const idx = chip.dataset.gif;
        if (removed.has(idx)) return;
        removed.add(idx);
        chip.classList.add("removed");
        update();
      });
    });

    update();

    return {
      check(){
        const muted = parseInt(slider.value, 10) === 0;
        const cleared = removed.size === TOTAL_GIFS;
        if (muted && cleared) {
          audio.pause();
          return { success: true };
        }
        if (!muted && !cleared) return { success: false, hint: "Todavía hay música de fondo sonando y GIFs decorativos en pantalla. Elimina ambos tipos de ruido." };
        if (!muted) return { success: false, hint: "Ya quitaste los GIFs, pero la música de fondo sigue sonando. Baja el volumen a cero." };
        return { success: false, hint: "Silenciaste la música, pero aún quedan GIFs decorativos distrayendo. Elimínalos." };
      }
    };
  }

  // ==================================================================
  // NIVEL 2 · CONTIGÜIDAD — arrastrar etiquetas al diagrama
  // ==================================================================
  function buildContiguidad(zone){
    zone.innerHTML = `
      <div class="dnd-zone" id="dnd-zone">
        <div class="diagram-wrap" id="diagram-wrap" style="background-image:url('${CELL_IMG}');">
          <div class="dropzone" data-target="nucleo" style="top:50.4%; left:49.4%;"><span class="dz-hint">?</span></div>
          <div class="dropzone" data-target="membrana" style="top:10.9%; left:50%;"><span class="dz-hint">?</span></div>
          <div class="dropzone" data-target="mitocondria" style="top:23.7%; left:54.7%;"><span class="dz-hint">?</span></div>
        </div>
        <div class="chip-tray" id="chip-tray">
          <div class="chip" data-answer="membrana">Membrana celular</div>
          <div class="chip" data-answer="nucleo">Núcleo</div>
          <div class="chip" data-answer="mitocondria">Mitocondria</div>
        </div>
      </div>
    `;

    // Contenedor de referencia para TODOS los cálculos de posición.
    // Nunca usamos coordenadas de ventana (position:fixed) porque un
    // ancestro con transform (p. ej. la ligera rotación de .evidence)
    // cambia el sistema de referencia de "fixed" y descoloca el arrastre.
    const dndZone = zone.querySelector("#dnd-zone");
    const chips = Array.from(zone.querySelectorAll(".chip"));
    const dropzones = Array.from(zone.querySelectorAll(".dropzone"));
    let filledCount = 0;

    chips.forEach(chip => {
      chip.addEventListener("pointerdown", (e) => {
        if (chip.classList.contains("placed")) return;
        e.preventDefault();
        chip.setPointerCapture(e.pointerId);

        const zoneRect = dndZone.getBoundingClientRect();
        const chipRect = chip.getBoundingClientRect();
        const chipWidth = chipRect.width;
        const grabOffsetX = e.clientX - chipRect.left;
        const grabOffsetY = e.clientY - chipRect.top;

        chip.style.position = "absolute";
        chip.style.left = (chipRect.left - zoneRect.left) + "px";
        chip.style.top = (chipRect.top - zoneRect.top) + "px";
        chip.style.width = chipWidth + "px";
        chip.style.zIndex = "1000";
        chip.style.pointerEvents = "none";

        function onMove(ev){
          const r = dndZone.getBoundingClientRect();
          chip.style.left = (ev.clientX - r.left - grabOffsetX) + "px";
          chip.style.top = (ev.clientY - r.top - grabOffsetY) + "px";
        }

        function onUp(ev){
          chip.removeEventListener("pointermove", onMove);
          chip.removeEventListener("pointerup", onUp);

          // OJO: hay que leer qué hay debajo del cursor ANTES de
          // reactivar pointer-events en el chip; si no, el propio
          // chip (que está justo sobre el cursor) tapa la zona de
          // destino y elementFromPoint nunca la detecta.
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          const dz = under ? under.closest(".dropzone") : null;

          if (dz && !dz.classList.contains("filled") && dz.dataset.target === chip.dataset.answer) {
            const dzRect = dz.getBoundingClientRect();
            const r = dndZone.getBoundingClientRect();
            chip.style.left = (dzRect.left - r.left + dzRect.width / 2 - chipWidth / 2) + "px";
            chip.style.top = (dzRect.top - r.top + dzRect.height / 2 - 14) + "px";
            chip.style.pointerEvents = "none";
            chip.classList.add("placed");
            dz.classList.add("filled");
            dz.innerHTML = chip.textContent;
            filledCount++;
          } else {
            chip.style.position = "";
            chip.style.left = "";
            chip.style.top = "";
            chip.style.width = "";
            chip.style.zIndex = "";
            chip.style.pointerEvents = "";
            chip.classList.add("shake");
            setTimeout(() => chip.classList.remove("shake"), 350);
          }
        }

        chip.addEventListener("pointermove", onMove);
        chip.addEventListener("pointerup", onUp);
      });
    });

    return {
      check(){
        if (filledCount === dropzones.length) return { success: true };
        return { success: false, hint: `Aún faltan ${dropzones.length - filledCount} etiqueta(s) por colocar en su lugar correcto sobre el diagrama.` };
      }
    };
  }

  // ==================================================================
  // NIVEL 3 · SEÑALIZACIÓN — resaltar las pistas clave
  // ==================================================================
  function buildSenalizacion(zone){
    const chunks = [
      { text: "La revolución industrial surgió por ", correct: false },
      { text: "la disponibilidad de carbón y hierro en Inglaterra", correct: true },
      { text: ", el desarrollo de ", correct: false },
      { text: "la máquina de vapor por James Watt", correct: true },
      { text: " permitió mecanizar la producción textil, y ", correct: false },
      { text: "la acumulación de capital proveniente del comercio colonial", correct: true },
      { text: " financió la construcción de nuevas fábricas y ferrocarriles a lo largo del siglo XVIII y XIX.", correct: false }
    ];

    zone.innerHTML = `<p class="highlight-para" id="hl-para">${
      chunks.map((c, i) => `<span class="word-chunk" data-idx="${i}" data-correct="${c.correct}">${c.text}</span>`).join("")
    }</p>`;

    const spans = Array.from(zone.querySelectorAll(".word-chunk"));
    spans.forEach(span => {
      span.addEventListener("click", () => span.classList.toggle("highlighted"));
    });

    const totalCorrect = chunks.filter(c => c.correct).length;

    return {
      check(){
        const highlighted = spans.filter(s => s.classList.contains("highlighted"));
        const correctHighlighted = highlighted.filter(s => s.dataset.correct === "true").length;
        const wrongHighlighted = highlighted.filter(s => s.dataset.correct === "false").length;

        if (correctHighlighted === totalCorrect && wrongHighlighted === 0) return { success: true };
        if (wrongHighlighted > 0) return { success: false, hint: "Resaltaste texto que no es una causa clave. Quita ese resaltado y concéntrate solo en las tres causas centrales." };
        return { success: false, hint: `Vas bien, pero aún faltan ${totalCorrect - correctHighlighted} causa(s) clave por resaltar.` };
      }
    };
  }

  // ==================================================================
  // NIVEL 4 · SEGMENTACIÓN — cortar la cinta en 3 módulos con clics
  // ==================================================================
  function buildSegmentacion(zone){
    zone.innerHTML = `
      <img src="${IMG_PLAYER}" alt="Reproductor de video" style="width:100%; border-radius:8px; margin-bottom:14px; display:block;">
      <div class="cut-track" id="cut-track"></div>
      <div class="timeline-caption"><span>0:00</span><span>45:00</span></div>
      <p class="cut-hint-text" id="cut-hint-text">Cortes realizados: 0 / 2</p>
    `;

    const track = zone.querySelector("#cut-track");
    const hintText = zone.querySelector("#cut-hint-text");
    const cuts = [];

    function render(){
      track.querySelectorAll(".cut-mark, .cut-segment").forEach(el => el.remove());

      const sorted = [...cuts].sort((a, b) => a - b);
      sorted.forEach(pos => {
        const mark = document.createElement("div");
        mark.className = "cut-mark";
        mark.style.left = pos + "%";
        track.appendChild(mark);
      });

      if (sorted.length === 2) {
        track.classList.add("has-cuts");
        const bounds = [0, sorted[0], sorted[1], 100];
        for (let i = 0; i < 3; i++){
          const seg = document.createElement("div");
          seg.className = "cut-segment";
          seg.style.left = bounds[i] + "%";
          seg.style.width = (bounds[i + 1] - bounds[i]) + "%";
          seg.textContent = "Módulo " + (i + 1);
          track.appendChild(seg);
        }
      } else {
        track.classList.toggle("has-cuts", sorted.length > 0);
      }

      hintText.textContent = `Cortes realizados: ${cuts.length} / 2`;
    }

    track.addEventListener("click", (e) => {
      if (cuts.length >= 2) return;
      const rect = track.getBoundingClientRect();
      let pct = ((e.clientX - rect.left) / rect.width) * 100;
      pct = Math.max(4, Math.min(96, pct));
      cuts.push(pct);
      render();
    });

    return {
      check(){
        if (cuts.length < 2) {
          return { success: false, hint: "Aún falta cortar la cinta: haz clic sobre ella dos veces para dividir el video en tres módulos." };
        }
        const sorted = [...cuts].sort((a, b) => a - b);
        const widths = [sorted[0], sorted[1] - sorted[0], 100 - sorted[1]];
        const tooNarrow = widths.some(w => w < 15);
        if (tooNarrow) {
          return { success: false, hint: "Los cortes quedaron muy juntos: reordénalos para que los tres módulos tengan una duración más pareja." };
        }
        return { success: true };
      }
    };
  }

    const channelStatus = zone.querySelector("#channel-status");

    const narrationAudio = zone.querySelector("#narration-audio");
    const recordBtn = zone.querySelector("#record-btn");
    const ringFill = zone.querySelector("#ring-fill");
    const recordIcon = zone.querySelector("#record-icon");
    const recordLabel = zone.querySelector("#record-label");

    const CIRCUMFERENCE = 276.5; // 2 * PI * 44, ya fijado también en CSS
    const HOLD_MS = 2000;

    let rafId = null;
    let startTime = null;
    let completed = false;

    denseText.style.opacity = "1";
    audioIndicator.style.opacity = "0";

    function setProgress(p){
      ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - p);
      denseText.style.opacity = String(1 - p);
      audioIndicator.style.opacity = String(p);

      const overload = Math.round((1 - p) * 100);
      modalFill.style.width = overload + "%";
      modalFill.style.background = overload > 55
        ? "linear-gradient(90deg, var(--stamp-red), #d97757)"
        : (overload > 15 ? "linear-gradient(90deg, var(--gold), #d9b25c)" : "linear-gradient(90deg, var(--stamp-green), #6fae2f)");

      if (p < 0.5) {
        channelStatus.classList.remove("ok");
        channelStatus.innerHTML = "👁️ + 📖 Canal visual sobrecargado: estás leyendo <strong>y</strong> observando al mismo tiempo";
      } else {
        channelStatus.classList.add("ok");
        channelStatus.innerHTML = "👁️ + 👂 Canales distintos: escuchas la narración <strong>mientras</strong> observas, sin competir";
      }
    }

    function tick(now){
      if (startTime === null) return;
      const elapsed = now - startTime;
      const p = Math.min(1, elapsed / HOLD_MS);
      setProgress(p);
      recordLabel.textContent = "Grabando narración... " + Math.round(p * 100) + "%";

      if (p >= 1) {
        completed = true;
        startTime = null;
        recordBtn.classList.add("completed");
        recordIcon.textContent = "✔️";
        recordLabel.textContent = "Narración grabada y archivada";
        narrationAudio.currentTime = 0;
        narrationAudio.play().catch(() => {});
        if (typeof autoVerify === "function") autoVerify();
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function resetProgress(){
      if (completed) return;
      cancelAnimationFrame(rafId);
      startTime = null;
      setProgress(0);
      recordLabel.textContent = "Mantén presionado para grabar la narración del chef";
    }

    setProgress(0);

    recordBtn.addEventListener("pointerdown", (e) => {
      if (completed) return;
      recordBtn.setPointerCapture(e.pointerId);
      startTime = performance.now();
      rafId = requestAnimationFrame(tick);
    });

    recordBtn.addEventListener("pointerup", resetProgress);
    recordBtn.addEventListener("pointercancel", resetProgress);
    recordBtn.addEventListener("pointerleave", () => {
      // en escritorio, soltar el mouse fuera del botón también debe reiniciar
      if (!completed && startTime !== null) resetProgress();
    });

    return {
      check(){
        if (completed) return { success: true };
        return { success: false, hint: "El texto denso todavía comparte el canal visual con la demostración: tus ojos deben leer y observar a la vez. Mantén presionado el micrófono sin soltar hasta completar la grabación de la narración." };
      }
    };
  }

  // ------------------------------------------------------------------
  // Beep corto sin archivos de audio (Web Audio API) — DING / BZZZT
  // ------------------------------------------------------------------
  let _actx = null;
  function playTone(type, streak){
    try {
      _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = _actx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === "ok") {
        const bump = Math.pow(2, Math.min(streak || 0, 6) / 12); // sube medio tono por racha, hasta 6 semitonos
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25 * bump, ctx.currentTime);
        osc.frequency.setValueAtTime(783.99 * bump, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
        osc.start();
        osc.stop(ctx.currentTime + 0.32);
      } else {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.22);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.24);
        osc.start();
        osc.stop(ctx.currentTime + 0.24);
      }
    } catch (e) { /* audio no disponible: seguimos sin sonido */ }
  }

  function buildSintonizador(zone, autoVerify){
    const ROUNDS = [
      { scenario: "Analizar en detalle las grietas de una estructura sin que la imagen se mueva.",

        wrong:   { icon: "📊", label: "Presentación", why: "Exige mirar diapositivas paso a paso; inútil si no puedes ver la pantalla." } },

        wrong:   { icon: "🎥", label: "Video", why: "Corre de forma continua: el profesor pierde el control del ritmo de su propia clase." } },
      { scenario: "Ver cómo se mueven los electrones dentro de un átomo (imposible de grabar en la realidad).",
        correct: { icon: "🎞️", label: "Animación", why: "Recrea digitalmente un proceso invisible que ninguna cámara real podría filmar." },
        wrong:   { icon: "📷", label: "Fotografía", why: "Es una imagen fija: no puede representar movimiento ni procesos dinámicos." } },

        wrong:   { icon: "📈", label: "Infografía", why: "Resume datos en íconos y texto; no puede mostrar comportamiento real en movimiento." } }
    ];

    // Cada escena se parte en 2 tarjetas (una correcta y una incorrecta), en orden aleatorio.
    const DECK = [];
    ROUNDS.forEach((r, sceneIdx) => {
      const pair = Math.random() < 0.5 ? [r.wrong, r.correct] : [r.correct, r.wrong];
      pair.forEach(item => {
        DECK.push({
          sceneIdx,
          scenario: r.scenario,
          icon: item.icon,
          label: item.label,
          why: item.why,
          expected: item === r.correct ? "si" : "no"
        });
      });
    });

    let cardIdx = 0;
    let finished = false;
    let locked = false;

    function progressStrip(){
      const currentScene = Math.min(Math.floor(cardIdx / 2), ROUNDS.length - 1);
      const nodes = ROUNDS.map((_, i) => {
        let cls = "circuit-node";
        if (i < currentScene) cls += " lit";
        else if (i === currentScene) cls += " current";
        return `<span class="${cls}"></span>`;
      }).join("");
      return `<div class="circuit-strip">${nodes}</div>`;
    }

    function renderCard(){
      const card = DECK[cardIdx];
      locked = false;

      zone.innerHTML = `
        ${progressStrip()}
        <div class="round-counter">Propuesta ${cardIdx + 1} / ${DECK.length}</div>
        <p class="round-scenario">"${card.scenario}"</p>
        <div class="swipe-stack">
          <div class="swipe-card" id="swipe-card">
            <span class="swipe-hint si">SÍ SIRVE</span>
            <span class="swipe-hint no">NO SIRVE</span>
            <span class="sw-icon">${card.icon}</span>
            <span class="sw-label">${card.label}</span>
          </div>
        </div>
        <div class="swipe-actions">
          <button type="button" class="swipe-btn reject" id="btn-no">❌ No sirve</button>
          <button type="button" class="swipe-btn accept" id="btn-si">✅ Sí sirve</button>
        </div>
        <div class="swipe-why" id="swipe-why"></div>
      `;

      const cardEl = zone.querySelector("#swipe-card");
      const hintSi = cardEl.querySelector(".swipe-hint.si");
      const hintNo = cardEl.querySelector(".swipe-hint.no");
      const btnSi = zone.querySelector("#btn-si");
      const btnNo = zone.querySelector("#btn-no");
      const whyBox = zone.querySelector("#swipe-why");

      function answer(choice){
        if (locked) return;

        if (choice === card.expected) {
          locked = true;
          playTone("ok", 0);
          btnSi.disabled = true;
          btnNo.disabled = true;
          cardEl.classList.add(choice === "si" ? "fly-right" : "fly-left");

          whyBox.textContent = "🟢 " + card.why;
          whyBox.className = "swipe-why ok show";

          setTimeout(() => {
            cardIdx++;
            if (cardIdx >= DECK.length) renderTrophy();
            else renderCard();
          }, 700);
        } else {
          playTone("fail", 0);
          cardEl.classList.remove("shake");
          void cardEl.offsetWidth;
          cardEl.classList.add("shake");
          whyBox.textContent = "🔴 Esa no es la decisión correcta para este caso. Piénsalo de nuevo.";
          whyBox.className = "swipe-why bad show";
          setTimeout(() => cardEl.classList.remove("shake"), 350);
        }
      }

      btnSi.addEventListener("click", () => answer("si"));
      btnNo.addEventListener("click", () => answer("no"));

      // Arrastre táctil/mouse opcional, además de los botones.
      let dragging = false, startX = 0, dx = 0;
      cardEl.addEventListener("pointerdown", (e) => {
        if (locked) return;
        dragging = true;
        startX = e.clientX;
        cardEl.setPointerCapture(e.pointerId);
        cardEl.classList.add("no-drag-transition");
      });
      cardEl.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        dx = e.clientX - startX;
        cardEl.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
        hintSi.style.opacity = dx > 20 ? Math.min(1, dx / 90) : 0;
        hintNo.style.opacity = dx < -20 ? Math.min(1, -dx / 90) : 0;
      });
      function endDrag(){
        if (!dragging) return;
        dragging = false;
        cardEl.classList.remove("no-drag-transition");
        if (dx > 90) { answer("si"); }
        else if (dx < -90) { answer("no"); }
        else {
          cardEl.style.transform = "";
          hintSi.style.opacity = 0;
          hintNo.style.opacity = 0;
        }
        dx = 0;
      }
      cardEl.addEventListener("pointerup", endDrag);
      cardEl.addEventListener("pointercancel", endDrag);
    }

    function renderTrophy(){
      finished = true;
      zone.innerHTML = `
        ${progressStrip()}
        <div class="trophy-box">
          <div class="t-icon">🏆</div>
          <p>¡Filtro completado! Has comprobado que el lenguaje audiovisual no se reduce al video: cada formato sirve cuando el contexto lo pide.</p>
          <button type="button" class="btn-phase" id="trophy-continue">Registrar hallazgo en el expediente →</button>
        </div>
      `;
      zone.querySelector("#trophy-continue").addEventListener("click", () => {
        if (typeof autoVerify === "function") autoVerify();
      });
    }

    renderCard();

    return {
      check(){
        if (finished) return { success: true };
        return { success: false, hint: "Todavía te quedan propuestas por filtrar. Decide si cada formato sirve o no para su situación antes de cerrar el expediente." };
      }
    };
  }

        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const order = shuffled(ITEMS.map((_, i) => i));

    const eraBoxesHtml = ERAS.map(era => `
      <div class="era-box" data-era="${era.key}" id="era-${era.key}">
        <div class="era-box-icon">${era.icon}</div>
        <div class="era-box-label">${era.label}</div>
        <div class="era-slots">
          <div class="era-slot"></div>
          <div class="era-slot"></div>
        </div>
      </div>
    `).join("");

    const chipsHtml = order.map(i => {
      const it = ITEMS[i];
      return `<div class="chip obj-chip" data-idx="${i}" data-era="${it.era}"><span class="chip-ico">${it.icon}</span><span class="chip-txt">${it.label}</span></div>`;
    }).join("");

    zone.innerHTML = `
      <div class="dnd-zone" id="dnd-zone">
        <div class="timeline-scroll">
          <div class="timeline-strip" id="timeline-strip">${eraBoxesHtml}</div>
        </div>
        <div class="timeline-tray-label">Bandeja de objetos por clasificar</div>
        <div class="chip-tray" id="chip-tray">${chipsHtml}</div>
      </div>
    `;

    // Contenedor de referencia para TODOS los cálculos de posición.
    // Nunca usamos coordenadas de ventana (position:fixed) porque un
    // ancestro con transform (p. ej. la ligera rotación de .evidence)
    // cambia el sistema de referencia de "fixed" y descoloca el arrastre.
    const dndZone = zone.querySelector("#dnd-zone");
    const chips = Array.from(zone.querySelectorAll(".chip"));
    let filledCount = 0;

    chips.forEach(chip => {
      chip.addEventListener("pointerdown", (e) => {
        if (chip.classList.contains("placed")) return;
        e.preventDefault();
        chip.setPointerCapture(e.pointerId);

        const zoneRect = dndZone.getBoundingClientRect();
        const chipRect = chip.getBoundingClientRect();
        const chipWidth = chipRect.width;
        const grabOffsetX = e.clientX - chipRect.left;
        const grabOffsetY = e.clientY - chipRect.top;

        chip.style.position = "absolute";
        chip.style.left = (chipRect.left - zoneRect.left) + "px";
        chip.style.top = (chipRect.top - zoneRect.top) + "px";
        chip.style.width = chipWidth + "px";
        chip.style.zIndex = "1000";
        chip.style.pointerEvents = "none";

        function onMove(ev){
          const r = dndZone.getBoundingClientRect();
          chip.style.left = (ev.clientX - r.left - grabOffsetX) + "px";
          chip.style.top = (ev.clientY - r.top - grabOffsetY) + "px";
        }

        function onUp(ev){
          chip.removeEventListener("pointermove", onMove);
          chip.removeEventListener("pointerup", onUp);

          // OJO: hay que leer qué hay debajo del cursor ANTES de
          // reactivar pointer-events en el chip; si no, el propio
          // chip (que está justo sobre el cursor) tapa la casilla de
          // destino y elementFromPoint nunca la detecta.
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          const box = under ? under.closest(".era-box") : null;
          const openSlot = box ? box.querySelector(".era-slot:not(.filled)") : null;

          if (box && openSlot && box.dataset.era === chip.dataset.era) {
            const slotRect = openSlot.getBoundingClientRect();
            const r = dndZone.getBoundingClientRect();
            chip.style.left = (slotRect.left - r.left + slotRect.width / 2 - chipWidth / 2) + "px";
            chip.style.top = (slotRect.top - r.top + slotRect.height / 2 - 14) + "px";
            chip.style.pointerEvents = "none";
            chip.classList.add("placed");
            openSlot.classList.add("filled");
            openSlot.textContent = chip.querySelector(".chip-ico").textContent;
            filledCount++;

            if (!box.querySelector(".era-slot:not(.filled)")) box.classList.add("era-full");
          } else {
            chip.style.position = "";
            chip.style.left = "";
            chip.style.top = "";
            chip.style.width = "";
            chip.style.zIndex = "";
            chip.style.pointerEvents = "";
            chip.classList.add("shake");
            setTimeout(() => chip.classList.remove("shake"), 350);
          }
        }

        chip.addEventListener("pointermove", onMove);
        chip.addEventListener("pointerup", onUp);
      });
    });

    return {
      check(){
        if (filledCount === ITEMS.length) return { success: true };
        return { success: false, hint: `Aún faltan ${ITEMS.length - filledCount} objeto(s) por ubicar en su época correcta de la línea de tiempo.` };
      }
    };
  }

          <div>
            <h1>Archivo: Auditor Multimedia</h1>
            <p>División de Diseño Instruccional Audiovisual</p>
          </div>
        </div>
        <div class="confidential-stamp">Confidencial</div>
      </div>
      <div class="tab-rail">${tabsHtml}</div>
      ${innerHtml}
      <footer class="note">Medios Audiovisuales</footer>
    `;

    app.querySelectorAll(".tab[data-goto]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.goto, 10);
        state.currentCase = idx;
        state.solved = false;
        state.showIntro = false;
        renderCase();
      });
    });

    const introTab = app.querySelector(".tab-intro");
    if (introTab) {
      introTab.addEventListener("click", () => {
        state.showIntro = true;
        renderIntro();
      });
    }
  }

  function renderIntro(){
    const introHtml = `
      <div class="folder">
        <div class="briefing-icon-wrap">
          <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
          <div class="briefing-icon">🎬</div>
        </div>
        <h2 class="briefing-title">¿Qué son los Medios Audiovisuales?</h2>

        <p class="briefing-text">Son cualquier forma de comunicación que combina <strong>imagen y sonido</strong> para transmitir un mensaje, usando <strong>dos canales sensoriales a la vez</strong>: el visual y el auditivo. Eso los hace poderosos, pero también fáciles de arruinar si se satura un canal o se desordena el ritmo.</p>

        <div class="briefing-channels">
          <div class="briefing-channel">
            <div class="bc-badge bc-imagen">📷</div>
            <div class="bc-label bc-imagen">Imagen</div>
          </div>
          <div class="briefing-channel">
            <div class="bc-badge bc-sonido">🎙️</div>
            <div class="bc-label bc-sonido">Sonido</div>
          </div>
          <div class="briefing-channel">
            <div class="bc-badge bc-texto">✏️</div>
            <div class="bc-label bc-texto">Texto</div>
          </div>
          <div class="briefing-channel">
            <div class="bc-badge bc-movimiento">🎞️</div>
            <div class="bc-label bc-movimiento">Movimiento</div>
          </div>
        </div>

        <p class="briefing-text">En los <strong>8 expedientes</strong> siguientes vas a encontrar piezas audiovisuales con errores reales de diseño instruccional, e investigar cómo corregirlas.</p>

        <p class="briefing-text">Este proyecto convierte esa teoría en algo que se pone a prueba y se siente, no solo se memoriza.</p>

        <div class="briefing-callout">
          <span class="co-icon">🔍</span>
          <p>¿Qué hay detrás de un recurso audiovisual cuando su propósito es enseñar?</p>
        </div>

        <div class="briefing-actions">
          <button type="button" class="btn-start" id="start-btn">📁 Abrir el primer expediente →</button>
        </div>
      </div>
    `;

    renderShell(introHtml);

    document.getElementById("start-btn").addEventListener("click", () => {
      state.showIntro = false;
      renderCase();
    });
  }

  function renderCase(){
    const c = CASES[state.currentCase];
    state.solved = false;

    const folderHtml = `
      <div class="folder">
        <div class="folder-top">
          <span class="case-number">Expediente ${c.code}</span>
          <span class="principle-tag">${c.principle}</span>
        </div>
        <h2>${c.title}</h2>

        <div class="section-label">Declaración del denunciante</div>
        <p class="declaration">${c.declaration}</p>

        <div class="evidence-wrap">
          <div class="paperclip"></div>
          <div class="evidence">
            <div class="evidence-label">${c.evidenceLabel}</div>
            <div class="evidence-inner" id="interactive-zone"></div>
          </div>
        </div>

        <span class="interrogation-label">Corrección requerida</span>
        <p class="question-text">${c.instruction}</p>

        <div class="verify-row">
          <button type="button" class="btn-verify" id="verify-btn">Presentar corrección al expediente</button>
          <div class="verdict-stamp" id="verdict-stamp"></div>
        </div>

        <div class="notes" id="notes-box"></div>

        <div class="actions">
          <button type="button" class="btn-next" id="next-btn">Cerrar expediente y continuar →</button>
        </div>
      </div>
    `;

    renderShell(folderHtml);

    const verifyBtn = document.getElementById("verify-btn");
    const stampEl = document.getElementById("verdict-stamp");
    const notesBox = document.getElementById("notes-box");
    const nextBtn = document.getElementById("next-btn");
    let attempts = 0;

    function runVerify(){
      if (state.solved) return;
      attempts++;
      const result = interaction.check();

      stampEl.classList.remove("show", "approved", "rejected");
      void stampEl.offsetWidth; // reiniciar animación

      if (result.success) {
        state.solved = true;
        stampEl.textContent = "Aprobado";
        stampEl.classList.add("approved", "show");

        notesBox.className = "notes show success";
        notesBox.innerHTML = `<strong>Notas del investigador — ${c.principle}</strong>${c.correctNote}`;

        nextBtn.classList.add("show");
        verifyBtn.disabled = true;
        state.results.push({ principle: c.principle, firstTry: attempts === 1 });
      } else {
        stampEl.textContent = "Rechazado";
        stampEl.classList.add("rejected", "show");

        notesBox.className = "notes show";
        notesBox.innerHTML = `<strong>Nota preliminar</strong>${result.hint}`;
      }
    }

    const zone = document.getElementById("interactive-zone");
    const interaction = c.build(zone, runVerify);

    verifyBtn.addEventListener("click", runVerify);

    nextBtn.addEventListener("click", () => {
      state.currentCase++;
      if (state.currentCase >= CASES.length) renderBoard();
      else renderCase();
    });
  }

  function renderBoard(){
    const total = CASES.length;
    const firstTryCount = state.results.filter(r => r.firstTry).length;

    const pinsHtml = state.results.map(r => `
      <div class="pin-card">
        <div class="pin-dot"></div>
        <div class="p-name">${r.principle}</div>
        <div class="p-status ${r.firstTry ? "" : "retry"}">${r.firstTry ? "✓ Resuelto al primer intento" : "✓ Resuelto tras revisión"}</div>
      </div>
    `).join("");

    const boardHtml = `
      <div class="board">
        <div class="closed-stamp">Caso Cerrado</div>
        <div class="board-title">Tablero de Investigación</div>
        <div class="board-sub">Los ${total} expedientes de diseño instruccional audiovisual han sido corregidos y resueltos.</div>
        <div class="pin-grid">${pinsHtml}</div>
        <div class="report-line">Correcciones resueltas al primer intento: <span>${firstTryCount} / ${total}</span></div>
        <button type="button" class="btn-restart" id="restart-btn">Abrir nuevo expediente</button>
      </div>
    `;

    renderShell(boardHtml);

    document.getElementById("restart-btn").addEventListener("click", () => {
      state.currentCase = 0;
      state.results = [];
      renderCase();
    });
  }

  renderIntro();
})();
</script>
